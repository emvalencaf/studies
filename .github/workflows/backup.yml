name: Backup do Turso para o Drive

on:
  schedule:
    - cron: "0 7 * * *" # todo dia, 04:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
      RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
      DRIVE_FOLDER: studies-backups
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - name: Instalar rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
      - name: Exportar o banco
        run: uv run python -m studies.backup
      - name: Enviar ao Drive e manter os 10 mais recentes
        run: |
          rclone copy data/backups "drive:$DRIVE_FOLDER" --include "studies-*.db"
          rclone lsf "drive:$DRIVE_FOLDER" --files-only | sort -r | tail -n +11 | while read -r f; do
            rclone deletefile "drive:$DRIVE_FOLDER/$f"
          done
          test "$(rclone lsf "drive:$DRIVE_FOLDER" --files-only | wc -l)" -ge 1
      - name: Registrar o backup no banco
        run: uv run python -m studies.backup record
