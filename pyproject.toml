[project]
name = "studies"
version = "0.1.0"
description = "Simulados da Udemy com histórico de Attempts e dashboard"
requires-python = ">=3.12"
dependencies = [
    "libsql>=0.1.11",
    "pandas",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
scrape = ["playwright"]
api = ["fastapi", "uvicorn"]

[dependency-groups]
dev = [
    "fastapi",
    "httpx",
    "playwright",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
